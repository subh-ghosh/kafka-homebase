<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafka Portal - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            background: rgba(255,255,255,0.05);
            font-weight: 600;
            color: #a5d6ff;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #ff4757;
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="glow-orb red"></div>
        <div class="glow-orb blue"></div>
    </div>

    <main class="container admin-container">
        <header>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1>Admin Control Panel</h1>
        </header>

        <!-- Login -->
        <div id="login-section" class="glass-card" style="max-width: 400px; margin: 0 auto;">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Authenticate</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="admin-user" placeholder="admin">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="admin-pass">
            </div>
            <button id="login-btn" class="primary-btn">Login</button>
            <div id="login-err" class="error"></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-section" class="glass-card hidden">
            <div class="stats-grid">
                <div class="stat-card">
                    <div>Total Users</div>
                    <div class="stat-value" id="stat-total">-</div>
                </div>
                <div class="stat-card">
                    <div>Capacity</div>
                    <div class="stat-value" id="stat-max">-</div>
                </div>
                <div class="stat-card">
                    <div>Status</div>
                    <div class="stat-value" style="color: #2ed573;">Online</div>
                </div>
            </div>

            <h3 style="margin-bottom: 1rem; color: #fff;">Registered Developers</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Kafka Username</th>
                            <th>GitHub Handle</th>
                            <th>Base Topic</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="5" style="text-align: center; color: #888;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let authToken = localStorage.getItem('adminToken');
        
        const showLogin = () => {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        };

        const showDashboard = () => {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            loadData();
        };

        const loadData = async () => {
            try {
                const res = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Basic ${authToken}` }
                });
                if (res.status === 401) {
                    localStorage.removeItem('adminToken');
                    showLogin();
                    return;
                }
                const data = await res.json();
                
                document.getElementById('stat-total').innerText = data.total_users;
                document.getElementById('stat-max').innerText = data.max_users;

                const tbody = document.getElementById('users-tbody');
                tbody.innerHTML = '';
                
                if (Object.keys(data.users).length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #888;">No users found.</td></tr>';
                    return;
                }

                for (const [username, info] of Object.entries(data.users)) {
                    const tr = document.createElement('tr');
                    
                    tr.innerHTML = `
                        <td style="font-family: monospace; color: #a5d6ff;">${username}</td>
                        <td>${info.githubHandle || info.githubId}</td>
                        <td><code>${info.topicName}</code></td>
                        <td>${new Date(info.created_at).toLocaleDateString()}</td>
                        <td>
                            <button class="primary-btn btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="deleteUser('${username}')">Delete User</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                }
            } catch (err) {
                alert('Failed to load admin data');
            }
        };

        window.deleteUser = async (username) => {
            if (!confirm(`WARNING: This will permanently delete user ${username}, all their topics, data, and credentials. Are you sure?`)) return;
            
            try {
                const res = await fetch(`/api/admin/users/${username}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Basic ${authToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    loadData();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Server error.');
            }
        };

        document.getElementById('login-btn').addEventListener('click', async () => {
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            const token = btoa(`${u}:${p}`);
            
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Authorization': `Basic ${token}` }
                });
                if (res.ok) {
                    authToken = token;
                    localStorage.setItem('adminToken', token);
                    showDashboard();
                } else {
                    document.getElementById('login-err').innerText = 'Invalid credentials';
                    document.getElementById('login-err').classList.add('show');
                }
            } catch(e) {
                document.getElementById('login-err').innerText = 'Server error';
                document.getElementById('login-err').classList.add('show');
            }
        });

        if (authToken) {
            showDashboard();
        } else {
            showLogin();
        }
    </script>
</body>
</html>
