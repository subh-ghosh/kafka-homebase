<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamBase — Admin Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --yellow:  #FFE500;
        --black:   #111111;
        --white:   #FFFFFF;
        --bg:      #FFFEF2;
        --red:     #FF3B30;
        --green:   #1DB954;
        --border:  3px solid #111111;
        --shadow:  5px 5px 0 #111111;
        --mono:    'DM Mono', monospace;
        --sans:    'Space Grotesk', sans-serif;
    }
    body { font-family: var(--sans); background: var(--bg); color: var(--black); line-height: 1.5; min-height: 100vh; }
    .hidden { display: none !important; }

    /* Navbar */
    .navbar { background: var(--black); border-bottom: var(--border); height: 56px; display: flex; align-items: center; }
    .navbar-inner { max-width: 1140px; margin: 0 auto; width: 100%; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .nav-logo { font-size: 1.1rem; font-weight: 800; color: var(--yellow); text-decoration: none; }
    .nav-logo span { color: var(--white); }

    /* Layout */
    .container { max-width: 1140px; margin: 0 auto; padding: 2.5rem 1.5rem; }

    /* Login Card */
    .login-box { max-width: 400px; margin: 4rem auto; }

    /* Cards */
    .card { background: var(--white); border: var(--border); box-shadow: var(--shadow); margin-bottom: 1.5rem; }
    .card-header { padding: 0.8rem 1.25rem; border-bottom: var(--border); background: var(--black); color: var(--white); font-weight: 800; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 1.5rem; }

    /* Buttons & Inputs */
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1.25rem; font-family: var(--sans); font-weight: 700; font-size: 0.88rem; border: var(--border); box-shadow: 4px 4px 0 var(--black); cursor: pointer; transition: all 0.1s ease; background: var(--white); color: var(--black); text-decoration: none; }
    .btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--black); }
    .btn-yellow { background: var(--yellow); }
    .btn-red { background: var(--red); color: var(--white); box-shadow: 4px 4px 0 #8B0000; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.78rem; box-shadow: 3px 3px 0 var(--black); }

    .input { width: 100%; padding: 0.7rem 0.9rem; font-family: var(--mono); font-size: 0.88rem; border: var(--border); background: var(--bg); outline: none; margin-bottom: 1rem; }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: var(--yellow); border: var(--border); box-shadow: var(--shadow); padding: 1.25rem; }
    .stat-val { font-size: 2.2rem; font-weight: 800; font-family: var(--mono); line-height: 1; margin-top: 0.4rem; }
    .stat-lbl { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #444; }

    /* Table */
    .user-table { width: 100%; border-collapse: collapse; }
    .user-table th { background: var(--black); color: var(--white); padding: 0.6rem 1rem; text-align: left; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .user-table td { padding: 0.75rem 1rem; border-top: 2px solid #e8e8e8; font-size: 0.85rem; vertical-align: middle; }
    .user-table tr:hover td { background: var(--bg); }
    .mono { font-family: var(--mono); }

    .badge { display: inline-block; padding: 0.15rem 0.55rem; font-size: 0.68rem; font-weight: 700; border: 2px solid var(--black); }
    .badge-green { background: var(--green); color: var(--white); }
    .badge-red { background: var(--red); color: var(--white); }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-inner">
        <a href="/" class="nav-logo">STREAM<span>BASE</span> <span style="font-size:0.75rem;color:var(--yellow);margin-left:0.5rem">ADMIN</span></a>
        <a href="/" style="color:#888;font-size:0.78rem;font-weight:700;text-decoration:none">← PORTAL</a>
    </div>
</nav>

<main class="container">
    <!-- Login Box -->
    <div id="login-section" class="card login-box">
        <div class="card-header">Admin Authentication</div>
        <div class="card-body">
            <label style="display:block;font-size:0.7rem;font-weight:700;text-transform:uppercase;margin-bottom:0.3rem">Password</label>
            <input type="password" id="admin-pass" class="input" placeholder="Enter admin password" />
            <div id="login-err" style="color:var(--red);font-size:0.8rem;font-weight:700;margin-bottom:1rem;display:none"></div>
            <button id="admin-login-btn" class="btn btn-yellow" style="width:100%;justify-content:center">Login</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-section" class="hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
            <h2 style="font-size:1.8rem;font-weight:800">System Overview</h2>
            <button id="admin-logout-btn" class="btn btn-red btn-sm">Log Out</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-lbl">Total Registered Users</div>
                <div class="stat-val" id="stat-total-users">—</div>
            </div>
            <div class="stat-card" style="background:var(--white)">
                <div class="stat-lbl">System Load (1/5/15m)</div>
                <div class="stat-val" id="stat-cpu" style="font-size:1.4rem;margin-top:0.8rem">—</div>
            </div>
            <div class="stat-card" style="background:var(--white)">
                <div class="stat-lbl">Free Memory</div>
                <div class="stat-val" id="stat-mem" style="font-size:1.4rem;margin-top:0.8rem">—</div>
            </div>
        </div>

        <div class="card" style="padding:0">
            <div class="card-header">
                <span>User Registry</span>
                <button id="refresh-users-btn" class="btn btn-sm btn-yellow">↻ Refresh</button>
            </div>
            <div style="overflow-x:auto">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>Kafka Username</th>
                            <th>GitHub Handle</th>
                            <th>Storage Used</th>
                            <th>Status</th>
                            <th>Created At</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="user-tbody">
                        <tr><td colspan="6" style="text-align:center;padding:2rem;color:#888">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
let authToken = sessionStorage.getItem('adminToken');

const showLogin = () => {
    document.getElementById('login-section').classList.remove('hidden');
    document.getElementById('dashboard-section').classList.add('hidden');
};

const showDashboard = () => {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('dashboard-section').classList.remove('hidden');
    fetchStats();
    fetchUsers();
};

const fetchStats = async () => {
    try {
        const res = await fetch('/api/admin/health', {
            headers: { 'Authorization': `Basic ${authToken}` }
        });
        if (res.status === 401) {
            sessionStorage.removeItem('adminToken');
            showLogin();
            return;
        }
        const data = await res.json();
        if (data.success) {
            document.getElementById('stat-cpu').innerText = data.cpu_load.map(n => n.toFixed(2)).join(', ');
            document.getElementById('stat-mem').innerText = `${data.free_mem_mb} MB / ${data.total_mem_mb} MB`;
        }
    } catch (err) { console.error('Stats fetch failed', err); }
};

const fetchUsers = async () => {
    const tbody = document.getElementById('user-tbody');
    try {
        const res = await fetch('/api/admin/users', {
            headers: { 'Authorization': `Basic ${authToken}` }
        });
        const data = await res.json();
        if (data.users || data.success) {
            document.getElementById('stat-total-users').innerText = `${data.total_users} / 200`;
            tbody.innerHTML = '';
            
            const users = data.users;
            const usernames = Object.keys(users);
            if (usernames.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:#888">No users found.</td></tr>';
                return;
            }

            usernames.forEach(username => {
                const info = users[username];
                const tr = document.createElement('tr');

                const storageMB = info.storageMB || 0;
                const storageStr = `${storageMB} MB / 125 MB`;
                const isBlocked = info.quotaExceeded === 1;

                const userTd = document.createElement('td'); userTd.className = 'mono'; userTd.style.fontWeight = 'bold'; userTd.textContent = username;
                const ghTd = document.createElement('td'); ghTd.textContent = info.githubHandle || info.githubId;
                const storeTd = document.createElement('td'); storeTd.className = 'mono'; storeTd.textContent = storageStr;
                
                const statusTd = document.createElement('td');
                statusTd.innerHTML = isBlocked ? '<span class="badge badge-red">BLOCKED</span>' : '<span class="badge badge-green">OK</span>';
                
                const dateTd = document.createElement('td'); dateTd.textContent = new Date(info.created_at).toLocaleDateString();

                const actTd = document.createElement('td');
                const delBtn = document.createElement('button');
                delBtn.className = 'btn btn-red btn-sm';
                delBtn.textContent = 'Delete';
                delBtn.addEventListener('click', () => deleteUser(username));
                actTd.appendChild(delBtn);

                tr.append(userTd, ghTd, storeTd, statusTd, dateTd, actTd);
                tbody.appendChild(tr);
            });
        }
    } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--red);padding:2rem">Failed to load users</td></tr>';
    }
};

const deleteUser = async (username) => {
    if (!confirm(`Are you sure you want to PERMANENTLY DELETE user "${username}"?`)) return;
    try {
        const res = await fetch(`/api/admin/users/${username}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Basic ${authToken}` }
        });
        const data = await res.json();
        if (data.success) {
            fetchUsers();
        } else {
            alert(data.error || 'Failed to delete user');
        }
    } catch (err) {
        alert('Server error deleting user');
    }
};

document.getElementById('admin-login-btn').addEventListener('click', async () => {
    const pass = document.getElementById('admin-pass').value.trim();
    if (!pass) return;
    const token = btoa(`admin:${pass}`);
    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Authorization': `Basic ${token}` }
        });
        if (res.ok) {
            authToken = token;
            sessionStorage.setItem('adminToken', token);
            document.getElementById('login-err').style.display = 'none';
            showDashboard();
        } else {
            const errEl = document.getElementById('login-err');
            errEl.innerText = 'Invalid credentials';
            errEl.style.display = 'block';
        }
    } catch (err) {
        alert('Login failed');
    }
});

document.getElementById('admin-logout-btn').addEventListener('click', () => {
    sessionStorage.removeItem('adminToken');
    authToken = null;
    showLogin();
});

document.getElementById('refresh-users-btn').addEventListener('click', fetchUsers);

if (authToken) {
    showDashboard();
} else {
    showLogin();
}
</script>
</body>
</html>
