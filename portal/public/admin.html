<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafka Portal - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            background: rgba(255,255,255,0.05);
            font-weight: 600;
            color: #a5d6ff;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #ff4757;
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="glow-orb red"></div>
        <div class="glow-orb blue"></div>
    </div>

    <main class="container admin-container">
        <header>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1>Admin Control Panel</h1>
        </header>

        <!-- Login -->
        <div id="login-section" class="glass-card" style="max-width: 400px; margin: 0 auto;">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Authenticate</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="admin-user" placeholder="admin">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="admin-pass">
            </div>
            <button id="login-btn" class="primary-btn">Login</button>
            <div id="login-err" class="error"></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-section" class="glass-card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <span style="color: rgba(255,255,255,0.5); font-size: 0.9rem;">Admin Panel</span>
                <button id="admin-logout-btn" style="color: #ff4757; background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.3); padding: 0.4rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem;">Log Out</button>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div>Total Users</div>
                    <div class="stat-value" id="stat-total">-</div>
                </div>
                <div class="stat-card">
                    <div>Capacity</div>
                    <div class="stat-value" id="stat-max">-</div>
                </div>
                <div class="stat-card">
                    <div>Status</div>
                    <div class="stat-value" style="color: #2ed573;">Online</div>
                </div>
            </div>

            <h3 style="margin-bottom: 1rem; color: #fff; margin-top: 1rem;">Server Health</h3>
            <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="stat-card">
                    <div>CPU Load (1m, 5m, 15m)</div>
                    <div class="stat-value" id="stat-cpu" style="font-size: 1.2rem; margin-top: 0.5rem; color: #a5d6ff;">-</div>
                </div>
                <div class="stat-card">
                    <div>Total Memory</div>
                    <div class="stat-value" id="stat-mem-total" style="font-size: 1.5rem; margin-top: 0.5rem; color: #a5d6ff;">-</div>
                </div>
                <div class="stat-card">
                    <div>Free Memory</div>
                    <div class="stat-value" id="stat-mem-free" style="font-size: 1.5rem; margin-top: 0.5rem; color: #2ed573;">-</div>
                </div>
            </div>

            <h3 style="margin-bottom: 1rem; color: #fff;">Registered Developers</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Kafka Username</th>
                            <th>GitHub Handle</th>
                            <th>Storage (MB)</th>
                            <th>Quota Status</th>
                            <th>Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="5" style="text-align: center; color: #888;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let authToken = sessionStorage.getItem('adminToken');
        
        const showLogin = () => {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        };

        const showDashboard = () => {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            loadData();
        };

        const loadData = async () => {
            try {
                const res = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Basic ${authToken}` }
                });
                if (res.status === 401) {
                    sessionStorage.removeItem('adminToken');
                    showLogin();
                    return;
                }
                const data = await res.json();
                
                document.getElementById('stat-total').innerText = data.total_users;
                document.getElementById('stat-max').innerText = data.max_users;

                fetch('/api/admin/health', { headers: { 'Authorization': `Basic ${authToken}` } })
                    .then(r => r.json())
                    .then(health => {
                        if(health.success) {
                            document.getElementById('stat-cpu').innerText = health.cpu_load.map(l => l.toFixed(2)).join(', ');
                            document.getElementById('stat-mem-total').innerText = health.total_mem_mb + ' MB';
                            
                            const freeMemEl = document.getElementById('stat-mem-free');
                            freeMemEl.innerText = health.free_mem_mb + ' MB';
                            
                            const memPercent = health.free_mem_mb / health.total_mem_mb;
                            if (memPercent < 0.1) {
                                freeMemEl.style.color = '#ff4757'; // red
                            } else if (memPercent < 0.3) {
                                freeMemEl.style.color = '#ffa502'; // orange
                            } else {
                                freeMemEl.style.color = '#2ed573'; // green
                            }
                        }
                    }).catch(console.error);

                const tbody = document.getElementById('users-tbody');
                tbody.innerHTML = '';
                
                if (Object.keys(data.users).length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #888;">No users found.</td></tr>';
                    return;
                }

                for (const [username, info] of Object.entries(data.users)) {
                    const tr = document.createElement('tr');
                    
                    const storageStr = info.storageMB !== undefined ? `${info.storageMB} MB` : '0.00 MB';
                    const isExceeded = info.quotaExceeded;
                    const quotaBadge = isExceeded 
                        ? `<span style="color: #ff4757; font-weight: bold;">BLOCKED</span>` 
                        : `<span style="color: #2ed573;">OK</span>`;

                    // Safe DOM construction — no innerHTML with user-controlled data
                    [
                        [username, 'font-family: monospace; color: #a5d6ff;'],
                        [info.githubHandle || info.githubId, ''],
                        [storageStr, 'font-family: monospace;'],
                        [null, '', quotaBadge],  // quota badge uses safe hardcoded html
                        [new Date(info.created_at).toLocaleDateString(), '']
                    ].forEach(([text, style, html]) => {
                        const td = document.createElement('td');
                        if (style) td.style.cssText = style;
                        if (html) td.innerHTML = html;  // quotaBadge is hardcoded — safe
                        else td.textContent = text;
                        tr.appendChild(td);
                    });
                    const actionTd = document.createElement('td');
                    const delBtn = document.createElement('button');
                    delBtn.className = 'primary-btn btn-danger';
                    delBtn.style.cssText = 'padding: 0.4rem 0.8rem; font-size: 0.8rem;';
                    delBtn.textContent = 'Delete User';
                    delBtn.addEventListener('click', () => deleteUser(username));
                    actionTd.appendChild(delBtn);
                    tr.appendChild(actionTd);
                }
            } catch (err) {
                alert('Failed to load admin data');
            }
        };

        window.deleteUser = async (username) => {
            if (!confirm(`WARNING: This will permanently delete user ${username}, all their topics, data, and credentials. Are you sure?`)) return;
            
            try {
                const res = await fetch(`/api/admin/users/${username}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Basic ${authToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    loadData();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Server error.');
            }
        };

        document.getElementById('login-btn').addEventListener('click', async () => {
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            const token = btoa(`${u}:${p}`);
            
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Authorization': `Basic ${token}` }
                });
                if (res.ok) {
                    authToken = token;
                    sessionStorage.setItem('adminToken', token);
                    showDashboard();
                } else {
                    document.getElementById('login-err').innerText = 'Invalid credentials';
                    document.getElementById('login-err').classList.add('show');
                }
            } catch(e) {
                document.getElementById('login-err').innerText = 'Server error';
                document.getElementById('login-err').classList.add('show');
            }
        });

        document.getElementById('admin-logout-btn').addEventListener('click', () => {
            sessionStorage.removeItem('adminToken');
            authToken = null;
            showLogin();
        });

        if (authToken) {
            showDashboard();
        } else {
            showLogin();
        }
    </script>
</body>
</html>
